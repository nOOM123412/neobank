<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NeoBank — iOS Edition (Demo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              bg: '#F2F2F7',
              card: '#FFFFFF',
              darkBg: '#000000',
              darkCard: '#1C1C1E',
              darkCard2: '#2C2C2E',
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9500',
              indigo: '#5856D6',
              gray: '#8E8E93',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: calc(0.5rem + var(--sab)); }
    .pt-safe { padding-top: var(--sat); }

    /* Эффект блика Apple Card */
    .card-sheen {
      background-image: linear-gradient(125deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.04) 38%, transparent 55%, rgba(255,255,255,0.08) 100%);
    }

    /* Анимации iOS */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-9px); }
      40%, 80% { transform: translateX(9px); }
    }
    .animate-shake { animation: shake 0.36s cubic-bezier(.36,.07,.19,.97); }

    @keyframes sheetUp {
      0% { opacity: 0; transform: translateY(28px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-sheet { animation: sheetUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(-8px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-toast { animation: fadeSlide 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Ползунок в стиле iOS */
    input[type="range"].ios-slider {
      -webkit-appearance: none;
      height: 5px;
      border-radius: 999px;
      background: rgba(120, 120, 128, 0.22);
      outline: none;
    }
    input[type="range"].ios-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22), 0 0 1px rgba(0,0,0,0.15);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-[#F2F2F7] dark:bg-black text-slate-950 dark:text-white transition-colors duration-300 min-h-screen">

  <!-- ======================================================================= -->
  <!-- ЭКРАН БЛОКИРОВКИ (iOS PASSCODE)                                         -->
  <!-- ======================================================================= -->
  <div id="lock-screen" class="fixed inset-0 z-50 text-white flex flex-col items-center justify-between py-12 px-6 overflow-hidden select-none" style="background: radial-gradient(circle at 20% 15%, #1e3a8a 0%, #0f172a 48%, #020617 100%);">
    <div class="pt-safe text-center mt-4 space-y-3">
      <div class="w-14 h-14 rounded-[18px] bg-white/10 backdrop-blur-xl border border-white/15 flex items-center justify-center mx-auto shadow-2xl">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
        </svg>
      </div>
      <div>
        <div class="flex items-center justify-center gap-2">
          <h1 class="text-xl font-bold tracking-tight">NeoBank</h1>
          <span class="text-[10px] font-semibold uppercase tracking-wider bg-white/15 text-blue-200 px-2 py-0.5 rounded-full backdrop-blur-md">Demo</span>
        </div>
        <p class="text-white/60 text-[13px] mt-1">Введите код-пароль (<span class="text-white/90 font-semibold tabular-nums">1234</span>)</p>
      </div>
    </div>

    <div class="flex flex-col items-center w-full max-w-[290px]">
      <div id="pin-dots" class="flex gap-5 mb-10">
        <div class="w-3.5 h-3.5 rounded-full border-[1.5px] border-white/50 transition-all duration-150"></div>
        <div class="w-3.5 h-3.5 rounded-full border-[1.5px] border-white/50 transition-all duration-150"></div>
        <div class="w-3.5 h-3.5 rounded-full border-[1.5px] border-white/50 transition-all duration-150"></div>
        <div class="w-3.5 h-3.5 rounded-full border-[1.5px] border-white/50 transition-all duration-150"></div>
      </div>

      <div class="grid grid-cols-3 gap-x-6 gap-y-4 w-full justify-items-center">
        ${[1,2,3,4,5,6,7,8,9].map(n => `
          <button onclick="pinPress('${n}')" class="w-[74px] h-[74px] rounded-full bg-white/[0.11] hover:bg-white/[0.18] active:bg-white/[0.34] backdrop-blur-md text-[28px] font-normal tabular-nums transition duration-150 flex items-center justify-center border border-white/[0.06]">${n}</button>
        `).join('')}
        <button onclick="biometricUnlock()" title="Вход по Face ID (заглушка)" class="w-[74px] h-[74px] rounded-full hover:bg-white/10 active:scale-95 text-white/90 transition flex items-center justify-center">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.75H6A2.25 2.25 0 003.75 6v1.5M16.5 3.75H18A2.25 2.25 0 0120.25 6v1.5m0 9V18A2.25 2.25 0 0118 20.25h-1.5m-9 0H6A2.25 2.25 0 013.75 18v-1.5M9 9.75v.75m6-.75v.75m-3 0v2.25c0 .414-.336.75-.75.75H11.25m-1.5 2.25a3.75 3.75 0 004.5 0"/>
          </svg>
        </button>
        <button onclick="pinPress('0')" class="w-[74px] h-[74px] rounded-full bg-white/[0.11] hover:bg-white/[0.18] active:bg-white/[0.34] backdrop-blur-md text-[28px] font-normal tabular-nums transition duration-150 flex items-center justify-center border border-white/[0.06]">0</button>
        <button onclick="pinBackspace()" class="w-[74px] h-[74px] rounded-full hover:bg-white/10 active:scale-95 text-white/80 transition flex items-center justify-center">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75L14.25 12m0 0l2.25 2.25M14.25 12l2.25-2.25M14.25 12L12 14.25m-2.58 4.92l-6.375-6.375a1.125 1.125 0 010-1.59L9.42 4.83c.211-.211.498-.33.796-.33H19.5a2.25 2.25 0 012.25 2.25v10.5a2.25 2.25 0 01-2.25 2.25h-9.284c-.298 0-.585-.119-.796-.33z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="text-[11px] text-white/40 text-center">
      Демонстрационная песочница • Все данные локальны
    </div>
  </div>

  <!-- ======================================================================= -->
  <!-- ОСНОВНОЙ ИНТЕРФЕЙС                                                      -->
  <!-- ======================================================================= -->
  <div id="app" class="hidden min-h-screen flex flex-col md:flex-row max-w-[1280px] mx-auto md:py-5 md:px-5 gap-6">

    <!-- macOS / iPadOS САЙДБАР (ДЕСКТОП) -->
    <aside class="hidden md:flex flex-col w-[264px] shrink-0 bg-white/85 dark:bg-[#1C1C1E]/90 backdrop-blur-2xl rounded-[28px] p-4 shadow-[0_2px_20px_rgba(0,0,0,0.04)] border border-black/[0.05] dark:border-white/[0.08] h-[calc(100vh-2.5rem)] sticky top-5">
      <div class="flex items-center justify-between px-2.5 pt-1 pb-5 border-b border-black/[0.05] dark:border-white/[0.07]">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-[12px] bg-gradient-to-br from-[#007AFF] to-[#5856D6] flex items-center justify-center text-white shadow-md shadow-blue-500/25">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9m18 0V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v3"/></svg>
          </div>
          <div>
            <div class="font-bold text-[16px] tracking-tight leading-none">NeoBank</div>
            <div class="text-[10px] font-semibold text-[#8E8E93] mt-1">iOS Sandbox</div>
          </div>
        </div>
        <button onclick="state.darkMode=!state.darkMode; saveState(); render();" title="Сменить тему" id="desktop-theme-btn" class="w-8 h-8 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] flex items-center justify-center text-slate-600 dark:text-slate-300 hover:scale-105 transition"></button>
      </div>

      <nav id="desktop-nav" class="flex-1 space-y-1 py-4"></nav>

      <div class="pt-3 border-t border-black/[0.05] dark:border-white/[0.07] space-y-1">
        <button onclick="openSupportModal()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-[14px] text-[13px] font-medium text-slate-700 dark:text-slate-200 hover:bg-black/[0.04] dark:hover:bg-white/[0.06] transition">
          <span class="w-5 h-5 flex items-center justify-center text-[#34C759]" id="sidebar-chat-icon"></span>
          <span>Поддержка 24/7</span>
        </button>
        <button onclick="lockApp()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-[14px] text-[13px] font-medium text-[#FF3B30] hover:bg-[#FF3B30]/10 transition">
          <span class="w-5 h-5 flex items-center justify-center" id="sidebar-lock-icon"></span>
          <span>Заблокировать</span>
        </button>
      </div>
    </aside>

    <!-- ОСНОВНАЯ КОЛОНКА КОНТЕНТА -->
    <main class="flex-1 flex flex-col min-w-0 pb-28 md:pb-8">

      <!-- STICKY iOS TOP NAVIGATION BAR -->
      <header class="sticky top-0 z-20 pt-safe bg-[#F2F2F7]/85 dark:bg-black/85 backdrop-blur-xl px-4 py-3 md:px-1 md:pt-0 md:bg-transparent md:dark:bg-transparent md:backdrop-blur-none md:static">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button onclick="navigate('profile')" class="w-10 h-10 rounded-full bg-gradient-to-br from-[#5856D6] to-[#007AFF] text-white text-[13px] font-bold flex items-center justify-center shadow-sm active:scale-95 transition">
              АС
            </button>
            <div>
              <div class="text-[12px] text-[#8E8E93] font-medium flex items-center gap-1.5">
                <span>Александр Соколов</span>
                <span class="text-[9px] font-bold uppercase tracking-wider bg-[#007AFF]/12 text-[#007AFF] px-1.5 py-0.5 rounded-md">Demo</span>
              </div>
              <h1 id="header-title" class="font-bold text-[22px] md:text-[26px] tracking-tight leading-tight">Главная</h1>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="togglePrivacy()" id="privacy-btn" title="Скрыть или показать балансы" class="w-9 h-9 rounded-full bg-white/90 dark:bg-[#1C1C1E] border border-black/[0.05] dark:border-white/[0.08] flex items-center justify-center text-slate-700 dark:text-slate-200 shadow-xs active:scale-95 transition"></button>
            <button onclick="openNotificationsModal()" id="notif-btn" title="Уведомления" class="relative w-9 h-9 rounded-full bg-white/90 dark:bg-[#1C1C1E] border border-black/[0.05] dark:border-white/[0.08] flex items-center justify-center text-slate-700 dark:text-slate-200 shadow-xs active:scale-95 transition"></button>
            <button onclick="openSupportModal()" id="mobile-chat-btn" title="Чат с поддержкой" class="md:hidden w-9 h-9 rounded-full bg-white/90 dark:bg-[#1C1C1E] border border-black/[0.05] dark:border-white/[0.08] flex items-center justify-center text-[#007AFF] shadow-xs active:scale-95 transition"></button>
          </div>
        </div>
      </header>

      <!-- КОНТЕЙНЕР ЭКРАНОВ -->
      <div id="view-container" class="px-4 md:px-1 space-y-5 mt-1"></div>
    </main>

    <!-- МОБИЛЬНЫЙ iOS TAB BAR -->
    <nav id="mobile-nav" class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/85 dark:bg-[#1C1C1E]/85 backdrop-blur-2xl border-t border-black/[0.07] dark:border-white/[0.1] flex justify-around items-center pt-2 px-2 pb-safe"></nav>
  </div>

  <!-- МОДАЛЬНЫЕ ОКНА -->
  <div id="modal-root"></div>

  <!-- iOS TOAST УВЕДОМЛЕНИЯ (DYNAMIC ISLAND STYLE) -->
  <div id="toast-container" class="fixed top-4 inset-x-0 z-[70] flex flex-col items-center gap-2 pointer-events-none px-4"></div>

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function formatMoney(amount, currency = 'RUB', forceShow = false) {
      if (state.hideBalances && !forceShow) {
        return currency === 'USD' ? '$ ••••' : '•••• ₽';
      }
      const sym = currency === 'USD' ? '$' : '₽';
      const formatted = new Intl.NumberFormat('ru-RU', {
        minimumFractionDigits: amount % 1 !== 0 ? 2 : 0,
        maximumFractionDigits: 2
      }).format(Math.abs(amount));
      const sign = amount < 0 ? '−' : '';
      return currency === 'USD' ? `${sign}$${formatted}` : `${sign}${formatted} ${sym}`;
    }

    function formatDate(ts) {
      const d = new Date(ts);
      const today = new Date();
      const yesterday = new Date(Date.now() - 86400000);
      const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      if (d.toDateString() === today.toDateString()) return `Сегодня, ${time}`;
      if (d.toDateString() === yesterday.toDateString()) return `Вчера, ${time}`;
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + `, ${time}`;
    }

    function formatFullDate(ts) {
      return new Date(ts).toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const dotColor = type === 'error' ? 'bg-[#FF3B30]' : type === 'info' ? 'bg-[#007AFF]' : 'bg-[#34C759]';
      el.className = `bg-[#1C1C1E]/95 dark:bg-white/95 text-white dark:text-slate-950 backdrop-blur-xl px-4 py-2.5 rounded-full shadow-xl text-[13px] font-medium flex items-center gap-2.5 animate-toast pointer-events-auto border border-white/10 dark:border-black/10`;
      el.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span><span>${escapeHTML(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 250);
      }, 2600);
    }

    function calculateCashback(amount, category) {
      if (amount <= 0) return 0;
      const isSelected = state.selectedCashbackIds.includes(category);
      const poolItem = CASHBACK_POOL.find(p => p.id === category);
      if (isSelected && poolItem) return Math.floor(amount * (poolItem.rate / 100));
      if (state.selectedCashbackIds.includes('all')) return Math.floor(amount * 0.01);
      return 0;
    }

          for (let j = 0; j < 7; j++) {
            const border = i === 0 || i === 6 || j === 0 || j === 6;
            const inner = i >= 2 && i <= 4 && j >= 2 && j <= 4;
            m[r + i][c + j] = (border || inner) ? 1 : 0;
          }
        }
      };
      drawFinder(0, 0);
      drawFinder(0, size - 7);
      drawFinder(size - 7, 0);

      let hash = 2166136261;
      for (let i = 0; i < seedStr.length; i++) {
        hash ^= seedStr.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const inFinder = (r < 8 && c < 8) || (r < 8 && c >= size - 8) || (r >= size - 8 && c < 8);
          if (inFinder) continue;
          hash = Math.imul(hash ^ (r * 31 + c), 16777619);
          m[r][c] = (Math.abs(hash) % 10) > 4 ? 1 : 0;
        }
      }
      return m;
    }

    function renderQRSVG(seedStr, cls = 'w-20 h-20') {
      const m = buildQRMatrix(seedStr);
      let rects = '';
      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m.length; c++) {
          if (m[r][c]) rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="#0F172A"/>`;
        }
      }
      return `<svg viewBox="0 0 ${m.length} ${m.length}" class="${cls}" shape-rendering="crispEdges">${rects}</svg>`;
    }

    // Вспомогательная функция скругленных прямоугольников для Canvas
    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ГЕНЕРАТОР РЕАЛЬНОГО PDF-ФАЙЛА (PDF 1.4 С ХАЙ-РЕЗ CANVAS-РЕНДЕРОМ ДЛЯ ИДЕАЛЬНОЙ КИРИЛЛИЦЫ)
    function downloadReceiptPDF(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx) return;

      showToast('Формирование PDF-чека...', 'info');

      const W = 1240;
      const H = 1754;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // Белый лист A4
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);

      // Верхняя синяя полоса бренда
      const topGrad = ctx.createLinearGradient(0, 0, W, 0);
      topGrad.addColorStop(0, '#007AFF');
      topGrad.addColorStop(1, '#5856D6');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, W, 18);

      const pad = 96;

      // Логотип NeoBank
      roundRectPath(ctx, pad, 86, 76, 76, 18);
      ctx.fillStyle = '#007AFF';
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 38px -apple-system, Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('N', pad + 38, 126);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#0F172A';
      ctx.font = '800 36px -apple-system, Inter, sans-serif';
      ctx.fillText('NeoBank', pad + 98, 120);
      ctx.fillStyle = '#64748B';
      ctx.font = '500 22px -apple-system, Inter, sans-serif';
      ctx.fillText('ПАО «НеоБанк Демо» • БИК 044525999', pad + 98, 152);

      // Правый заголовок
      ctx.textAlign = 'right';
      ctx.fillStyle = '#64748B';
      ctx.font = '600 22px -apple-system, Inter, sans-serif';
      ctx.fillText('КВИТАНЦИЯ ПО ОПЕРАЦИИ', W - pad, 114);
      ctx.fillStyle = '#0F172A';
      ctx.font = '700 24px monospace';
      ctx.fillText('№ NB-' + tx.id, W - pad, 148);

      // Разделитель
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pad, 200);
      ctx.lineTo(W - pad, 200);
      ctx.stroke();

      // Блок суммы (iOS card style)
      roundRectPath(ctx, pad, 240, W - pad * 2, 210, 28);
      ctx.fillStyle = '#F2F2F7';
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#64748B';
      ctx.font = '600 24px -apple-system, Inter, sans-serif';
      ctx.fillText(tx.amount > 0 ? 'СУММА ЗАЧИСЛЕНИЯ' : 'СУММА ОПЕРАЦИИ', W / 2, 296);

      ctx.fillStyle = tx.amount > 0 ? '#16A34A' : '#0F172A';
      ctx.font = '800 66px -apple-system, Inter, sans-serif';
      const amtText = (tx.amount > 0 ? '+' : '') + formatMoney(tx.amount, tx.currency, true);
      ctx.fillText(amtText, W / 2, 376);

      ctx.fillStyle = '#16A34A';
      ctx.font = '700 24px -apple-system, Inter, sans-serif';
      ctx.fillText('● ' + tx.status.toUpperCase(), W / 2, 422);

      // Таблица реквизитов
      const cat = CATEGORIES[tx.category] || CATEGORIES.shopping;
      const rows = [
        ['Дата и время операции', formatFullDate(tx.date) + ' (МСК)'],
        ['Наименование / Получатель', tx.title],
        ['Детали платежа', tx.subtitle],
        ['Плательщик', 'Соколов Александр Сергеевич'],
        ['Счет / Карта', '•••• ' + (tx.cardLast4 || '9042')],
        ['Категория операции', `${cat.label} (MCC ${cat.mcc})`],
        ['Комиссия банка', '0,00 ₽'],
        ['Начисленный кэшбэк', tx.cashback > 0 ? `+${tx.cashback} ₽` : '0 ₽'],
        ['Код авторизации', tx.authCode || 'NB' + tx.id.slice(-4)],
        ['Идентификатор транзакции', 'TX-' + tx.id + '-DEMO'],
      ];

      let y = 520;
      const rowH = 74;
      rows.forEach(([label, val], i) => {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#64748B';
        ctx.font = '500 24px -apple-system, Inter, sans-serif';
        ctx.fillText(label, pad, y);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#0F172A';
        ctx.font = '600 24px -apple-system, Inter, sans-serif';
        ctx.fillText(String(val).slice(0, 44), W - pad, y);

        if (i < rows.length - 1) {
          ctx.strokeStyle = '#F1F5F9';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(pad, y + 26);
          ctx.lineTo(W - pad, y + 26);
          ctx.stroke();
        }
        y += rowH;
      });

      // QR-код внизу слева
      const qrY = 1320;
      const matrix = buildQRMatrix(tx.id + tx.title);
      const cell = 8;
      const qrSize = matrix.length * cell;
      roundRectPath(ctx, pad, qrY, qrSize + 36, qrSize + 36, 18);
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#0F172A';
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix.length; c++) {
          if (matrix[r][c]) {
            ctx.fillRect(pad + 18 + c * cell, qrY + 18 + r * cell, cell, cell);
          }
        }
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = '#64748B';
      ctx.font = '500 20px -apple-system, Inter, sans-serif';
      ctx.fillText('Проверка подлинности', pad + qrSize + 60, qrY + 75);
      ctx.fillText('ЭЦП: 9F4A-22E1-DEMO', pad + qrSize + 60, qrY + 110);
      ctx.fillText('Сформировано: ' + new Date().toLocaleDateString('ru-RU'), pad + qrSize + 60, qrY + 145);

      // Круглая синяя банковская печать справа
      ctx.save();
      ctx.translate(W - pad - 140, qrY + 100);
      ctx.rotate(-0.14);
      ctx.strokeStyle = '#1D4ED8';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, 108, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 96, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#1D4ED8';
      ctx.textAlign = 'center';
      ctx.font = '800 17px -apple-system, Inter, sans-serif';
      ctx.fillText('ПАО «НЕОБАНК ДЕМО»', 0, -40);
      ctx.font = '800 23px -apple-system, Inter, sans-serif';
      ctx.fillText('ИСПОЛНЕНО', 0, 6);
      ctx.font = '600 15px -apple-system, Inter, sans-serif';
      ctx.fillText('ПРОВЕРЕНО ЭЦП', 0, 38);
      ctx.fillText(new Date(tx.date).toLocaleDateString('ru-RU'), 0, 62);
      ctx.restore();

      // Подвал
      ctx.textAlign = 'center';
      ctx.fillStyle = '#94A3B8';
      ctx.font = '400 19px -apple-system, Inter, sans-serif';
      ctx.fillText('Документ сформирован автоматически в демонстрационной системе NeoBank Sandbox.', W / 2, H - 72);

      // Конвертация Canvas -> JPEG -> Валидный PDF 1.4 Binary
      const dataUrl = canvas.toDataURL('image/jpeg', 0.93);
      const base64 = dataUrl.split(',')[1];
      const binStr = atob(base64);
      const jpegBytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) jpegBytes[i] = binStr.charCodeAt(i);

      const pdfBlob = createPdfBlobFromJpeg(jpegBytes, W, H);
      const url = URL.createObjectURL(pdfBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `NeoBank_Cheque_${tx.id}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      showToast(`Файл NeoBank_Cheque_${tx.id}.pdf сохранен`);
    }

    // Чистый упаковщик JPEG в бинарный формат PDF 1.4
    function createPdfBlobFromJpeg(jpegBytes, imgW, imgH) {
      const encoder = new TextEncoder();
      const chunks = [];
      const offsets = [0];
      let pos = 0;

      const pushBytes = (u8) => { chunks.push(u8); pos += u8.length; };
      const pushAscii = (str) => pushBytes(encoder.encode(str));

      // Заголовок PDF + бинарный маркер
      pushAscii('%PDF-1.4\n');
      pushBytes(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));

      // 1: Catalog
      offsets[1] = pos;
      pushAscii('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

      // 2: Pages
      offsets[2] = pos;
      pushAscii('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');

      // 3: Page (A4 = 595.28 x 841.89 pt)
      offsets[3] = pos;
      pushAscii('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');

      // 4: Image XObject
      offsets[4] = pos;
      pushAscii(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
      pushBytes(jpegBytes);
      pushAscii('\nendstream\nendobj\n');

      // 5: Content Stream
      const content = 'q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n';
      offsets[5] = pos;
      pushAscii(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);

      // XREF
      const xrefOffset = pos;
      pushAscii('xref\n0 6\n0000000000 65535 f \n');
      for (let i = 1; i <= 5; i++) {
        pushAscii(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
      }
      pushAscii(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);

      return new Blob(chunks, { type: 'application/pdf' });
    }

    // =========================================================================
    // 4. ЛОГИКА PIN-КОДА И ТЕМЫ
    // =========================================================================
    function applyTheme() {
      document.documentElement.classList.toggle('dark', state.darkMode);
    }

    function updatePinDots(isError = false) {
      const container = document.getElementById('pin-dots');
      const dots = container.children;
      for (let i = 0; i < 4; i++) {
        dots[i].className = i < currentPinInput.length
          ? 'w-3.5 h-3.5 rounded-full bg-white border-[1.5px] border-white scale-110 transition-all duration-150'
          : 'w-3.5 h-3.5 rounded-full border-[1.5px] border-white/50 transition-all duration-150';
      }
      if (isError) {
        container.classList.add('animate-shake');
        setTimeout(() => container.classList.remove('animate-shake'), 380);
      }
    }

    function pinPress(digit) {
      if (currentPinInput.length >= 4) return;
      currentPinInput += digit;
      updatePinDots();
      if (currentPinInput.length === 4) {
        setTimeout(() => {
          if (currentPinInput === state.pin) unlockApp();
          else {
            currentPinInput = '';
            updatePinDots(true);
            showToast('Неверный код-пароль (1234)', 'error');
          }
        }, 140);
      }
    }

    function pinBackspace() {
      currentPinInput = currentPinInput.slice(0, -1);
      updatePinDots();
    }

    function biometricUnlock() {
      showToast('Face ID подтвержден', 'info');
      unlockApp();
    }

    function unlockApp() {
      currentPinInput = '';
      updatePinDots();
      document.getElementById('lock-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      render();
    }

    function lockApp() {
      document.getElementById('app').classList.add('hidden');
      document.getElementById('lock-screen').classList.remove('hidden');
    }

              </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">

            <div class="bg-white dark:bg-[#1C1C1E] rounded-[26px] p-5 shadow-[0_2px_16px_rgba(0,0,0,0.03)] border border-black/[0.04] dark:border-white/[0.07]">

              </div>
              <div class="grid grid-cols-4 gap-2">
                ${CONTACTS.map(ct => `
                  <button onclick="startQuickTransfer('${ct.id}')" class="flex flex-col items-center gap-1.5 p-2 rounded-[18px] hover:bg-[#F2F2F7] dark:hover:bg-[#2C2C2E] active:scale-95 transition">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br ${ct.grad} text-white font-bold text-[14px] flex items-center justify-center shadow-sm">${ct.initials}</div>
                    <span class="text-[11px] font-medium truncate w-full text-center">${ct.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="bg-white dark:bg-[#1C1C1E] rounded-[26px] p-5 shadow-[0_2px_16px_rgba(0,0,0,0.03)] border border-black/[0.04] dark:border-white/[0.07]">
              <div class="flex justify-between items-center mb-3.5">
                <h3 class="font-bold text-[15px]">Накопления</h3>
                <button onclick="navigate('products')" class="text-[13px] text-[#007AFF] font-medium">Открыть</button>
              </div>
              <div class="space-y-3.5">
                ${state.goals.slice(0, 2).map(g => {
                  const pct = Math.min(100, Math.round((g.current / g.target) * 100));
                  return `
                    <div onclick="navigate('products')" class="cursor-pointer group">
                      <div class="flex justify-between items-center text-[13px] mb-1.5">
                        <div class="flex items-center gap-2 font-semibold">

                      </div>

              </div>
            </div>
          </div>

          <!-- ПОСЛЕДНИЕ ТРАНЗАКЦИИ (7/12 НА ПК) -->
          <div class="lg:col-span-7 bg-white dark:bg-[#1C1C1E] rounded-[26px] p-5 shadow-[0_2px_16px_rgba(0,0,0,0.03)] border border-black/[0.04] dark:border-white/[0.07]">
            <div class="flex justify-between items-center mb-2">
              <div>
                <h3 class="font-bold text-[16px]">Последние операции</h3>
                <p class="text-[11px] text-[#8E8E93]">Нажмите на трату, чтобы открыть PDF-чек</p>

    function renderTxRow(t) {
      const cat = CATEGORIES[t.category] || CATEGORIES.shopping;
      const isIncome = t.amount > 0;
      return `
        <div onclick="openTxModal('${t.id}')" class="flex items-center justify-between py-3 cursor-pointer hover:bg-[#F2F2F7]/70 dark:hover:bg-[#2C2C2E]/60 -mx-2.5 px-2.5 rounded-[16px] active:scale-[0.99] transition">
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-10 h-10 rounded-[13px] ${cat.bg} flex items-center justify-center shrink-0">
              ${icon(cat.icon, 'w-5 h-5')}
            </div>
            <div class="min-w-0">
              <div class="font-semibold text-[14px] truncate">${escapeHTML(t.title)}</div>
              <div class="text-[12px] text-[#8E8E93] truncate">${escapeHTML(t.subtitle)} • ${formatDate(t.date)}</div>

    // --- ЭКРАН 2: ПЕРЕВОДЫ И ПЛАТЕЖИ ---
    let transferMode = 'p2p';
    let prefillContact = null;

    function renderTransfers() {
      const activeCards = state.cards.filter(c => !c.frozen);
      return `
        <div class="bg-white dark:bg-[#1C1C1E] rounded-[28px] p-5 md:p-6 shadow-[0_2px_16px_rgba(0,0,0,0.03)] border border-black/[0.04] dark:border-white/[0.07] max-w-2xl">
          <!-- iOS SEGMENTED CONTROL -->
          <div class="grid grid-cols-3 p-1 bg-[#767680]/[0.12] dark:bg-[#2C2C2E] rounded-[12px] mb-6">
            ${[
              { id: 'p2p', label: 'По телефону' },
              { id: 'own', label: 'Между своими' },
              { id: 'services', label: 'Услуги' }
            ].map(tab => `
              <button onclick="transferMode='${tab.id}'; render()" class="py-1.5 text-[13px] font-semibold rounded-[9px] transition ${transferMode===tab.id ? 'bg-white dark:bg-[#636366] shadow-xs text-slate-950 dark:text-white' : 'text-slate-600 dark:text-slate-300'}">${tab.label}</button>
            `).join('')}

          ${activeCards.length === 0 ? `
            <div class="p-4 rounded-2xl bg-[#FF3B30]/10 text-[#FF3B30] text-[13px] font-medium text-center">
              Все ваши карты заморожены. Разморозьте карту в разделе «Главная».
            </div>
          ` : transferMode === 'p2p' ? renderP2PForm(activeCards) : transferMode === 'own' ? renderOwnTransferForm(activeCards) : renderServicesForm(activeCards)}
        </div>
      `;
    }

    function renderP2PForm(cards) {
      const rubCards = cards.filter(c => c.currency === 'RUB');
      return `
        <div class="mb-5">
          <div class="text-[12px] font-semibold text-[#8E8E93] mb-2.5">Быстрый выбор</div>
          <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
            ${CONTACTS.map(ct => `
              <button type="button" onclick="selectTransferContact('${ct.id}')" class="shrink-0 flex items-center gap-2.5 px-3 py-2 rounded-[16px] border transition ${prefillContact?.id === ct.id ? 'border-[#007AFF] bg-[#007AFF]/8' : 'border-black/[0.06] dark:border-white/[0.08] bg-[#F2F2F7]/60 dark:bg-[#2C2C2E]/60'}">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br ${ct.grad} text-white text-[11px] font-bold flex items-center justify-center">${ct.initials}</div>
                <div class="text-left">
                  <div class="text-[12px] font-semibold leading-tight">${ct.name}</div>
                  <div class="text-[10px] text-[#8E8E93]">${ct.bank}</div>
                </div>
              </button>
            `).join('')}
          </div>
        </div>

        <form onsubmit="handleP2PSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Счет списания</label>
            <select id="p2p-from" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] font-medium outline-none">
              ${rubCards.map(c => `<option value="${c.id}">${c.name} (•• ${c.number.slice(-4)}) — ${formatMoney(c.balance, c.currency, true)}</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Телефон или номер карты</label>
              <input id="p2p-to" type="text" required value="${prefillContact ? prefillContact.phone : ''}" placeholder="+7 (999) 000-00-00" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] outline-none focus:ring-2 focus:ring-[#007AFF]" />
            </div>
            <div>
              <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Банк получателя (СБП)</label>
              <select id="p2p-bank" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] outline-none">
                ${['Сбербанк', 'Т-Банк', 'Альфа-Банк', 'ВТБ', 'NeoBank'].map(b => `<option value="${b}" ${prefillContact?.bank === b ? 'selected' : ''}>${b}</option>`).join('')}
              </select>

          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Сумма перевода</label>
            <div class="relative">
              <input id="p2p-amount" type="number" min="1" step="0.01" required placeholder="1000" class="w-full px-4 py-3.5 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[22px] font-bold tabular-nums outline-none focus:ring-2 focus:ring-[#007AFF]" />
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[#8E8E93] font-bold">₽</span>
            </div>
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Комментарий</label>
            <input id="p2p-comment" type="text" placeholder="Сообщение получателю" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] outline-none focus:ring-2 focus:ring-[#007AFF]" />
          </div>
          <div class="flex items-center justify-between text-[12px] text-[#8E8E93] px-1">
            <span>Комиссия по СБП</span>
            <span class="font-semibold text-[#34C759]">0 ₽</span>
          </div>
          <button type="submit" class="w-full py-3.5 rounded-[16px] bg-[#007AFF] hover:bg-[#0066D6] text-white font-semibold text-[15px] shadow-md shadow-blue-500/20 active:scale-[0.99] transition">
            Перевести
          </button>
        </form>
      `;
    }

    function renderOwnTransferForm(cards) {
      if (cards.length < 2) return `<div class="text-[13px] text-[#8E8E93] py-4">Нужно минимум 2 активные карты.</div>`;
      return `
        <form onsubmit="handleOwnTransferSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Откуда</label>
            <select id="own-from" onchange="updateOwnPreview()" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] font-medium">
              ${cards.map(c => `<option value="${c.id}">${c.name} (${c.currency}) — ${formatMoney(c.balance, c.currency, true)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Куда</label>
            <select id="own-to" onchange="updateOwnPreview()" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] font-medium">
              ${cards.map((c, idx) => `<option value="${c.id}" ${idx === 1 ? 'selected' : ''}>${c.name} (${c.currency}) — ${formatMoney(c.balance, c.currency, true)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Сумма списания</label>
            <input id="own-amount" type="number" min="1" step="0.01" required placeholder="5000" oninput="updateOwnPreview()" class="w-full px-4 py-3.5 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[22px] font-bold tabular-nums outline-none focus:ring-2 focus:ring-[#007AFF]" />
            <div id="own-conversion-hint" class="text-[12px] text-[#007AFF] font-medium mt-1.5">Курс конвертации: 1 USD = ${USD_RATE} ₽</div>
          </div>
          <button type="submit" class="w-full py-3.5 rounded-[16px] bg-[#007AFF] hover:bg-[#0066D6] text-white font-semibold text-[15px] transition">
            Перевести между счетами
          </button>
        </form>
      `;
    }

    function updateOwnPreview() {
      const fromEl = document.getElementById('own-from');
      const toEl = document.getElementById('own-to');
      const amtEl = document.getElementById('own-amount');
      const hintEl = document.getElementById('own-conversion-hint');
      if (!fromEl || !toEl || !amtEl || !hintEl) return;
      const fromCard = state.cards.find(c => c.id === fromEl.value);
      const toCard = state.cards.find(c => c.id === toEl.value);
      const amt = parseFloat(amtEl.value);
      if (!fromCard || !toCard || isNaN(amt) || amt <= 0) {
        hintEl.textContent = `Курс при обмене: 1 USD = ${USD_RATE} ₽`;
        return;
      }
      let out = amt;
      if (fromCard.currency === 'RUB' && toCard.currency === 'USD') out = +(amt / USD_RATE).toFixed(2);
      else if (fromCard.currency === 'USD' && toCard.currency === 'RUB') out = +(amt * USD_RATE).toFixed(2);
      hintEl.textContent = `На ${toCard.name} зачислится: ${formatMoney(out, toCard.currency, true)}`;
    }

    function renderServicesForm(cards) {
      const rubCards = cards.filter(c => c.currency === 'RUB');
      const providers = [
        { name: 'Мобильная связь (МТС / Мегафон)', cat: 'services' },
        { name: 'ЖКХ и Электроэнергия', cat: 'services' },
        { name: 'Surf Coffee / Рестораны (кэшбэк)', cat: 'food' },
        { name: 'Яндекс Go / Такси (кэшбэк)', cat: 'transport' },
        { name: 'Ozon / Маркетплейсы (кэшбэк)', cat: 'shopping' },
      ];
      return `
        <form onsubmit="handleServiceSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Категория или продавец</label>
            <select id="srv-provider" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] font-medium">
              ${providers.map(p => `<option value="${p.cat}|${p.name}">${p.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Карта оплаты</label>
            <select id="srv-from" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] font-medium">
              ${rubCards.map(c => `<option value="${c.id}">${c.name} — ${formatMoney(c.balance, c.currency, true)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Номер телефона или счета</label>
            <input id="srv-account" type="text" required value="+7 (916) 123-45-67" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px]" />
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Сумма оплаты (₽)</label>
            <input id="srv-amount" type="number" min="1" step="0.01" required placeholder="500" class="w-full px-4 py-3.5 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[22px] font-bold tabular-nums" />
          </div>
          <button type="submit" class="w-full py-3.5 rounded-[16px] bg-[#5856D6] hover:bg-[#4B49C4] text-white font-semibold text-[15px] transition">
            Оплатить
          </button>
        </form>
      `;
    }

    function selectTransferContact(cid) {
      prefillContact = CONTACTS.find(c => c.id === cid) || null;
      render();
    }

    function startQuickTransfer(cid) {
      prefillContact = CONTACTS.find(c => c.id === cid) || null;
      transferMode = 'p2p';
      navigate('transfers');
    }

    // --- ЭКРАН 3: ИСТОРИЯ И АНАЛИТИКА ---
    let historySearch = '';
    let historyFilter = 'all';

    function getFilteredTransactions() {
      return state.transactions.filter(t => {
        const matchesCat = historyFilter === 'all' || t.category === historyFilter;
        const q = historySearch.trim().toLowerCase();
        const matchesSearch = !q || t.title.toLowerCase().includes(q) || t.subtitle.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });
    }

    function updateHistoryListOnly() {
      const box = document.getElementById('tx-list-container');
      if (!box) return;
      const list = getFilteredTransactions();
      box.innerHTML = list.length
        ? list.map(t => renderTxRow(t)).join('')
        : `<div class="text-center py-10 text-[13px] text-[#8E8E93]">Операции по запросу не найдены</div>`;
    }

    function renderAnalytics() {
      const expenses = state.transactions.filter(t => t.amount < 0);
      const incomes = state.transactions.filter(t => t.amount > 0);
      const totalExpense = expenses.reduce((s, t) => s + Math.abs(t.currency === 'USD' ? t.amount * USD_RATE : t.amount), 0);
      const totalIncome = incomes.reduce((s, t) => s + (t.currency === 'USD' ? t.amount * USD_RATE : t.amount), 0);

      const catTotals = {};
      expenses.forEach(t => {
        const val = Math.abs(t.currency === 'USD' ? t.amount * USD_RATE : t.amount);
        catTotals[t.category] = (catTotals[t.category] || 0) + val;
      });
      const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

      let offset = 0;
      const radius = 38;
      const circumference = 2 * Math.PI * radius;
      const segments = sortedCats.map(([catKey, val]) => {
        const pct = totalExpense > 0 ? val / totalExpense : 0;
        const dash = pct * circumference;
        const color = (CATEGORIES[catKey] || CATEGORIES.shopping).color;
        const seg = `<circle cx="50" cy="50" r="${radius}" fill="transparent" stroke="${color}" stroke-width="13" stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${-offset}" />`;
        offset += dash;
        return seg;
      }).join('');

      const filteredTx = getFilteredTransactions();

      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="bg-white dark:bg-[#1C1C1E] rounded-[26px] p-5 shadow-[0_2px_16px_rgba(0,0,0,0.03)] border border-black/[0.04] dark:border-white/[0.07] flex items-center gap-6">
            <div class="relative w-32 h-32 shrink-0">
              <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
                <circle cx="50" cy="50" r="${radius}" fill="transparent" stroke="currentColor" class="text-[#F2F2F7] dark:text-[#2C2C2E]" stroke-width="13" />
                ${segments}
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span class="text-[10px] text-[#8E8E93] font-medium">Расходы</span>
                <span class="text-[12px] font-bold tabular-nums">${formatMoney(totalExpense, 'RUB')}</span>
              </div>
            </div>
            <div class="flex-1 space-y-2.5 min-w-0">
              ${sortedCats.slice(0, 4).map(([key, val]) => {
                const c = CATEGORIES[key] || CATEGORIES.shopping;
                const pct = totalExpense > 0 ? Math.round((val / totalExpense) * 100) : 0;
                return `
                  <div class="flex items-center justify-between text-[12px]">
                    <div class="flex items-center gap-2 truncate">
                      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${c.color}"></span>
                      <span class="truncate font-medium">${c.label}</span>
                    </div>
                    <span class="font-bold tabular-nums ml-2">${pct}%</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-white dark:bg-[#1C1C1E] rounded-[26px] p-5 shadow-[0_2px_16px_rgba(0,0,0,0.03)] border border-black/[0.04] dark:border-white/[0.07] flex flex-col justify-center gap-3">
            <div class="flex justify-between items-center p-3.5 rounded-[18px] bg-[#34C759]/10">
              <span class="text-[13px] font-semibold text-[#248A3D] dark:text-[#34C759]">Зачисления</span>
              <span class="text-[17px] font-bold tabular-nums text-[#248A3D] dark:text-[#34C759]">+${formatMoney(totalIncome, 'RUB')}</span>
            </div>
            <div class="flex justify-between items-center p-3.5 rounded-[18px] bg-[#F2F2F7] dark:bg-[#2C2C2E]">
              <span class="text-[13px] font-semibold text-[#8E8E93]">Траты за период</span>
              <span class="text-[17px] font-bold tabular-nums">−${formatMoney(totalExpense, 'RUB')}</span>
            </div>
          </div>
        </div>

    // =========================================================================
    // 7. ОБРАБОТЧИКИ ПЕРЕВОДОВ И ПЛАТЕЖЕЙ
    // =========================================================================
    function handleP2PSubmit(e) {
      e.preventDefault();
      const fromId = document.getElementById('p2p-from').value;
      const to = document.getElementById('p2p-to').value.trim();
      const bank = document.getElementById('p2p-bank').value;
      const amount = parseFloat(document.getElementById('p2p-amount').value);
      const comment = document.getElementById('p2p-comment').value.trim();

      const card = state.cards.find(c => c.id === fromId);
      if (!card || card.frozen) return showToast('Карта недоступна', 'error');
      if (isNaN(amount) || amount <= 0) return showToast('Укажите сумму', 'error');
      if (amount > card.balance) return showToast('Недостаточно средств', 'error');
      if (amount > card.limit) return showToast(`Превышен лимит (${formatMoney(card.limit, 'RUB', true)})`, 'error');

      const recipientName = prefillContact && prefillContact.phone === to ? prefillContact.name : to;

      openConfirmTransferModal({
        title: `Перевод: ${recipientName}`,
        subtitle: `${bank} • ${comment || 'СБП'}`,
        fromCard: card,
        amount,
        currency: 'RUB',
        onConfirm: () => {
          card.balance -= amount;
          const tx = {
            id: String(Math.floor(100000 + Math.random() * 899999)),
            title: `Перевод: ${recipientName}`,
            subtitle: `${bank} • •${card.number.slice(-4)}`,
            cardLast4: card.number.slice(-4),
            amount: -amount,
            currency: 'RUB',
            category: 'transfer',
            date: Date.now(),
            status: 'Исполнено',
            cashback: 0,
            authCode: 'SP' + Math.floor(1000 + Math.random() * 8999)
          };
          state.transactions.unshift(tx);
          prefillContact = null;
          saveState();
          openSuccessTransferModal(tx);
          render();
        }
      });
    }

    function handleOwnTransferSubmit(e) {
      e.preventDefault();
      const fromId = document.getElementById('own-from').value;
      const toId = document.getElementById('own-to').value;
      const amount = parseFloat(document.getElementById('own-amount').value);
      if (fromId === toId) return showToast('Выберите разные счета', 'error');

      const fromCard = state.cards.find(c => c.id === fromId);
      const toCard = state.cards.find(c => c.id === toId);
      if (isNaN(amount) || amount <= 0 || amount > fromCard.balance) return showToast('Проверьте сумму и баланс', 'error');

      let creditedAmount = amount;
      if (fromCard.currency === 'RUB' && toCard.currency === 'USD') creditedAmount = +(amount / USD_RATE).toFixed(2);
      else if (fromCard.currency === 'USD' && toCard.currency === 'RUB') creditedAmount = +(amount * USD_RATE).toFixed(2);

      openConfirmTransferModal({
        title: `На ${toCard.name}`,
        subtitle: `Зачислится: ${formatMoney(creditedAmount, toCard.currency, true)}`,
        fromCard,
        amount,
        currency: fromCard.currency,
        onConfirm: () => {
          fromCard.balance -= amount;
          toCard.balance += creditedAmount;
          const tx = {
            id: String(Math.floor(100000 + Math.random() * 899999)),
            title: `На счет: ${toCard.name}`,
            subtitle: `С карты ${fromCard.name}`,
            cardLast4: fromCard.number.slice(-4),
            amount: -amount,
            currency: fromCard.currency,
            category: 'transfer',
            date: Date.now(),
            status: 'Исполнено',
            cashback: 0,
            authCode: 'IN' + Math.floor(1000 + Math.random() * 8999)
          };
          state.transactions.unshift(tx);
          saveState();
          openSuccessTransferModal(tx);
          render();
        }
      });
    }

    function handleServiceSubmit(e) {
      e.preventDefault();
      const [cat, providerName] = document.getElementById('srv-provider').value.split('|');
      const fromId = document.getElementById('srv-from').value;
      const account = document.getElementById('srv-account').value.trim();
      const amount = parseFloat(document.getElementById('srv-amount').value);

      const card = state.cards.find(c => c.id === fromId);
      if (isNaN(amount) || amount <= 0 || amount > card.balance) return showToast('Проверьте сумму и баланс', 'error');
      const cb = calculateCashback(amount, cat);

      openConfirmTransferModal({
        title: providerName,
        subtitle: `${account}${cb > 0 ? ` • Кэшбэк +${cb} ₽` : ''}`,
        fromCard: card,
        amount,
        currency: 'RUB',
        onConfirm: () => {
          card.balance -= amount;
          state.cashbackBalance += cb;
          const tx = {
            id: String(Math.floor(100000 + Math.random() * 899999)),
            title: providerName,
            subtitle: `${account} • •${card.number.slice(-4)}`,
            cardLast4: card.number.slice(-4),
            amount: -amount,
            currency: 'RUB',
            category: cat,
            date: Date.now(),
            status: 'Исполнено',
            cashback: cb,
            authCode: 'PY' + Math.floor(1000 + Math.random() * 8999)
          };
          state.transactions.unshift(tx);
          saveState();
          openSuccessTransferModal(tx);
          render();
        }
      });
    }

    function claimCashback() {
      if (state.cashbackBalance <= 0) return showToast('Нет доступного кэшбэка', 'info');
      const amt = state.cashbackBalance;
      state.cards[0].balance += amt;
      state.cashbackBalance = 0;
      state.transactions.unshift({
        id: String(Math.floor(100000 + Math.random() * 899999)),
        title: 'Выплата кэшбэка', subtitle: `На карту ${state.cards[0].name}`, cardLast4: state.cards[0].number.slice(-4),
        amount: amt, currency: 'RUB', category: 'income', date: Date.now(), status: 'Зачислено', cashback: 0, authCode: 'CB1000'
      });
      saveState();
      showToast(`+${formatMoney(amt, 'RUB', true)} зачислено на карту`);
      render();
    }

    function toggleCashbackCategory(id) {
      const idx = state.selectedCashbackIds.indexOf(id);
      if (idx > -1) state.selectedCashbackIds.splice(idx, 1);
      else {
        if (state.selectedCashbackIds.length >= 3) return showToast('Максимум 3 категории', 'error');
        state.selectedCashbackIds.push(id);
      }
      saveState();
      render();
    }

    function resetDemoData() {
      if (!confirm('Сбросить все балансы, карты и историю к начальному состоянию?')) return;
      state = getDefaultState();
      saveState();
      showToast('Данные восстановлены', 'info');
      navigate('dashboard');
    }

            <button id="confirm-tx-btn" onclick="executeConfirmedTransfer()" class="flex-1 py-3 rounded-[16px] bg-[#007AFF] text-white font-semibold text-[14px]">Подтвердить</button>
          </div>
        </div>
      `);
    }

    function executeConfirmedTransfer() {
      const code = document.getElementById('sms-code-input').value.trim();
      if (code.length < 4) return showToast('Введите 4 цифры (0000)', 'error');
      const btn = document.getElementById('confirm-tx-btn');
      btn.disabled = true;
      btn.textContent = 'Отправка...';
      setTimeout(() => {
        if (pendingTransferConfirm) pendingTransferConfirm();
        pendingTransferConfirm = null;
      }, 450);
    }

    function printReceipt(txId) {
      const el = document.getElementById('pdf-sheet-preview');
      if (!el) return;
      const win = window.open('', '_blank', 'width=600,height=800');
      if (!win) {
        window.print();
        return;
      }
      win.document.write(`
        <!DOCTYPE html><html><head><title>Чек NeoBank #${txId}</title>
        <script src="https://cdn.tailwindcss.com"><\/script>
        </head><body class="p-8 bg-white">${el.outerHTML}
        <script>setTimeout(() => { window.print(); }, 400);<\/script></body></html>
      `);
      win.document.close();
    }

        if (lbl) lbl.textContent = formatMoney(c.limit, c.currency, true);

    function toggleFreezeCard(cardId) {

    function handleTopUp(e) {
      e.preventDefault();
      const cardId = document.getElementById('topup-card').value;
      const amount = parseFloat(document.getElementById('topup-amount').value);
      const card = state.cards.find(c => c.id === cardId);
      if (!card || isNaN(amount) || amount <= 0) return;

      card.balance += amount;
      state.transactions.unshift({
        id: String(Math.floor(100000 + Math.random() * 899999)),
        title: `Пополнение: ${card.name}`, subtitle: 'Внешняя карта •4410', cardLast4: card.number.slice(-4),

      });
      saveState();
      closeModal();
      showToast(`+${formatMoney(amount, card.currency, true)} зачислено`);
      render();
    }

    function handleExchange(e) {
      e.preventDefault();
      const dir = document.getElementById('ex-dir').value;
      const usd = parseFloat(document.getElementById('ex-usd').value);
      const rubAmount = +(usd * USD_RATE).toFixed(2);
      const rubCard = state.cards.find(c => c.id === 'card_rub');
      const usdCard = state.cards.find(c => c.id === 'card_usd');

      if (dir === 'rub_usd') {
        if (rubAmount > rubCard.balance) return showToast('Недостаточно RUB', 'error');
        rubCard.balance -= rubAmount;
        usdCard.balance += usd;
        state.transactions.unshift({
          id: String(Math.floor(100000 + Math.random() * 899999)),
          title: `Покупка $${usd}`, subtitle: `Курс ${USD_RATE} ₽`, cardLast4: '9042',
          amount: -rubAmount, currency: 'RUB', category: 'transfer', date: Date.now(), status: 'Исполнено', cashback: 0, authCode: 'FX0102'
        });
      } else {
        if (usd > usdCard.balance) return showToast('Недостаточно USD', 'error');
        usdCard.balance -= usd;
        rubCard.balance += rubAmount;
        state.transactions.unshift({
          id: String(Math.floor(100000 + Math.random() * 899999)),
          title: `Продажа $${usd}`, subtitle: `Курс ${USD_RATE} ₽`, cardLast4: '3318',
          amount: rubAmount, currency: 'RUB', category: 'income', date: Date.now(), status: 'Зачислено', cashback: 0, authCode: 'FX0103'
        });
      }
      saveState();
      closeModal();
      showToast('Обмен выполнен');
      render();
    }

          <div class="w-44 h-44 mx-auto rounded-[28px] bg-slate-950 text-white flex flex-col items-center justify-center border-2 border-[#007AFF] gap-2 p-4">
            ${icon('qr', 'w-14 h-14 text-[#007AFF]')}
            <span class="text-[11px] text-white/60 leading-tight">Имитация сканера. Нажмите ниже для тестовой оплаты:</span>
          </div>
          <button onclick="payMockQR('Кофейня Surf (СБП)', 420, 'food')" class="w-full py-3.5 rounded-[16px] bg-[#007AFF] text-white font-semibold text-[14px]">Оплатить кофе — 420 ₽</button>
        </div>
      `);
    }

    function payMockQR(title, amount, cat) {
      const card = state.cards[0];
      if (card.frozen || card.balance < amount) return showToast('Проверьте баланс или статус карты', 'error');
      const cb = calculateCashback(amount, cat);
      card.balance -= amount;
      state.cashbackBalance += cb;
      const tx = {
        id: String(Math.floor(100000 + Math.random() * 899999)),
        title, subtitle: 'Оплата по СБП QR', cardLast4: card.number.slice(-4),
        amount: -amount, currency: 'RUB', category: cat, date: Date.now(), status: 'Исполнено', cashback: cb, authCode: 'QR7781'
      };
      state.transactions.unshift(tx);
      saveState();
      openSuccessTransferModal(tx);
      render();
    }

    // ЦЕЛИ (КОПИЛКИ)
    function openNewGoalModal() {
      showModal(`
        <form onsubmit="createGoal(event)" class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-[18px]">Новая цель</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] flex items-center justify-center text-[#8E8E93]">${icon('close', 'w-4 h-4')}</button>
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Название</label>
            <input id="goal-title" type="text" required placeholder="Покупка авто" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px]" />
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Иконка</label>
            <select id="goal-icon" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px]">
              <option value="target">Цель</option>
              <option value="plane">Путешествие</option>
              <option value="laptop">Техника</option>
              <option value="transport">Автомобиль</option>
              <option value="house">Недвижимость</option>
            </select>
          </div>
          <div>
            <label class="block text-[12px] font-semibold text-[#8E8E93] mb-1.5">Целевая сумма (₽)</label>
            <input id="goal-target" type="number" min="1000" required value="100000" class="w-full px-4 py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[20px] font-bold tabular-nums" />
          </div>
          <button type="submit" class="w-full py-3.5 rounded-[16px] bg-[#007AFF] text-white font-semibold text-[15px]">Создать</button>
        </form>
      `);
    }

    function createGoal(e) {
      e.preventDefault();
      const title = document.getElementById('goal-title').value.trim();
      const iconName = document.getElementById('goal-icon').value;
      const target = parseFloat(document.getElementById('goal-target').value);
      state.goals.push({ id: 'g_' + Date.now(), title, icon: iconName, target, current: 0 });
      saveState();
      closeModal();
      showToast('Цель создана');
      render();
    }

    function openGoalActionModal(goalId, action) {
      const g = state.goals.find(x => x.id === goalId);
      if (!g) return;
      const isAdd = action === 'add';
      showModal(`
        <form onsubmit="handleGoalAction(event, '${goalId}', '${action}')" class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-[18px]">${isAdd ? 'Пополнить цель' : 'Снять с цели'}</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] flex items-center justify-center text-[#8E8E93]">${icon('close', 'w-4 h-4')}</button>
          </div>
          <div class="text-[13px] text-[#8E8E93]">${escapeHTML(g.title)} • Накоплено: ${formatMoney(g.current, 'RUB', true)}</div>
          <input id="goal-amt" type="number" min="1" required value="5000" class="w-full px-4 py-3.5 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[22px] font-bold tabular-nums" />
          <button type="submit" class="w-full py-3.5 rounded-[16px] bg-[#007AFF] text-white font-semibold text-[15px]">${isAdd ? 'Пополнить с Neo Black' : 'Перевести на Neo Black'}</button>
        </form>
      `);
    }

    function handleGoalAction(e, goalId, action) {
      e.preventDefault();
      const amt = parseFloat(document.getElementById('goal-amt').value);
      const g = state.goals.find(x => x.id === goalId);
      const card = state.cards[0];

      if (action === 'add') {
        if (amt > card.balance) return showToast('Недостаточно средств на карте', 'error');
        card.balance -= amt;
        g.current += amt;
        state.transactions.unshift({ id: String(Math.floor(100000 + Math.random() * 899999)), title: `В копилку: ${g.title}`, subtitle: 'Накопительный счет', cardLast4: '9042', amount: -amt, currency: 'RUB', category: 'transfer', date: Date.now(), status: 'Исполнено', cashback: 0 });
      } else {
        if (amt > g.current) return showToast('Недостаточно средств в цели', 'error');
        g.current -= amt;
        card.balance += amt;
        state.transactions.unshift({ id: String(Math.floor(100000 + Math.random() * 899999)), title: `Из копилки: ${g.title}`, subtitle: 'Возврат на карту', cardLast4: '9042', amount: amt, currency: 'RUB', category: 'income', date: Date.now(), status: 'Зачислено', cashback: 0 });
      }
      saveState();
      closeModal();
      showToast('Баланс цели обновлен');
      render();
    }

    // ДЕМО-КРЕДИТ
    function openLoanModal() {
      showModal(`
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-[18px]">Кредитный калькулятор</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] flex items-center justify-center text-[#8E8E93]">${icon('close', 'w-4 h-4')}</button>
          </div>
          <div>
            <div class="flex justify-between text-[13px] font-semibold mb-2"><span>Сумма</span><span id="loan-val-lbl" class="text-[#007AFF] tabular-nums">100 000 ₽</span></div>
            <input id="loan-amt" type="range" min="10000" max="1000000" step="10000" value="100000" oninput="updateLoanCalc()" class="w-full ios-slider" />
          </div>
          <div>
            <div class="flex justify-between text-[13px] font-semibold mb-2"><span>Срок</span><span id="loan-term-lbl" class="text-[#007AFF] tabular-nums">12 мес.</span></div>
            <input id="loan-term" type="range" min="6" max="60" step="6" value="12" oninput="updateLoanCalc()" class="w-full ios-slider" />
          </div>
          <div class="p-4 rounded-[18px] bg-[#F2F2F7] dark:bg-[#2C2C2E] flex justify-between items-center">
            <span class="text-[12px] text-[#8E8E93]">Платеж в месяц (14.9%)</span>
            <span id="loan-monthly" class="text-[18px] font-bold tabular-nums">9 021 ₽</span>
          </div>
          <button onclick="approveMockLoan()" class="w-full py-3.5 rounded-[16px] bg-[#007AFF] text-white font-semibold text-[15px]">Зачислить на карту</button>
        </div>
      `);
    }

    function updateLoanCalc() {
      const amt = Number(document.getElementById('loan-amt').value);
      const term = Number(document.getElementById('loan-term').value);
      const r = 0.149 / 12;
      const pay = Math.round((amt * r * Math.pow(1 + r, term)) / (Math.pow(1 + r, term) - 1));
      document.getElementById('loan-val-lbl').textContent = formatMoney(amt, 'RUB', true);
      document.getElementById('loan-term-lbl').textContent = `${term} мес.`;
      document.getElementById('loan-monthly').textContent = formatMoney(pay, 'RUB', true);
    }

    function approveMockLoan() {
      const amt = Number(document.getElementById('loan-amt').value);
      state.cards[0].balance += amt;
      state.transactions.unshift({
        id: String(Math.floor(100000 + Math.random() * 899999)),
        title: 'Выдача демо-кредита', subtitle: 'Договор #DEMO', cardLast4: '9042',
        amount: amt, currency: 'RUB', category: 'income', date: Date.now(), status: 'Зачислено', cashback: 0, authCode: 'LN01'
      });
      saveState();
      closeModal();
      showToast(`+${formatMoney(amt, 'RUB', true)} зачислено`);
      render();
    }

    // УВЕДОМЛЕНИЯ
    function openNotificationsModal() {
      state.notifications.forEach(n => n.unread = false);
      saveState();
      renderNavigation();
      showModal(`
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-[18px]">Уведомления</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] flex items-center justify-center text-[#8E8E93]">${icon('close', 'w-4 h-4')}</button>
          </div>
          <div class="space-y-2.5">
            ${state.notifications.map(n => `
              <div class="p-3.5 rounded-[18px] bg-[#F2F2F7] dark:bg-[#2C2C2E]">
                <div class="flex justify-between text-[13px] font-semibold mb-1">
                  <span>${escapeHTML(n.title)}</span>
                  <span class="text-[#8E8E93] font-normal text-[11px]">${n.time}</span>
                </div>
                <p class="text-[12px] text-[#8E8E93] leading-relaxed">${escapeHTML(n.text)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    // СМЕНА PIN
    function openChangePinModal() {
      showModal(`
        <form onsubmit="handleChangePin(event)" class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-[18px]">Новый код-пароль</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] flex items-center justify-center text-[#8E8E93]">${icon('close', 'w-4 h-4')}</button>
          </div>
          <input id="new-pin-input" type="text" pattern="\\d{4}" maxlength="4" required placeholder="••••" class="w-full text-center text-[24px] tracking-[0.5em] font-mono py-3 rounded-[14px] bg-[#F2F2F7] dark:bg-[#2C2C2E]" />
          <button type="submit" class="w-full py-3.5 rounded-[16px] bg-[#007AFF] text-white font-semibold text-[15px]">Сохранить</button>
        </form>
      `);
    }

    function handleChangePin(e) {
      e.preventDefault();
      const val = document.getElementById('new-pin-input').value.trim();
      if (!/^\d{4}$/.test(val)) return showToast('Введите 4 цифры', 'error');
      state.pin = val;
      saveState();
      closeModal();
      showToast('Код-пароль обновлен');
    }

    // iMessage ЧАТ С ПОДДЕРЖКОЙ
    function openSupportModal() {
      showModal(`
        <div class="flex flex-col h-[72vh] sm:h-[480px]">
          <div class="flex justify-between items-center pb-3 border-b border-black/[0.06] dark:border-white/[0.08]">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-gradient-to-br from-[#007AFF] to-[#5856D6] text-white flex items-center justify-center">
                ${icon('sparkle', 'w-4 h-4')}
              </div>
              <div>
                <div class="font-bold text-[14px]">Поддержка NeoBank</div>
                <div class="text-[11px] text-[#34C759] font-medium">Онлайн</div>
              </div>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] flex items-center justify-center text-[#8E8E93]">${icon('close', 'w-4 h-4')}</button>
          </div>

          <div id="chat-messages" class="flex-1 overflow-y-auto py-4 space-y-2.5 no-scrollbar">
            ${renderChatMessages()}
          </div>

          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-2">
            ${['Где PDF-чек?', 'Курс валют', 'Кэшбэк', 'Карты'].map(q => `
              <button type="button" onclick="quickAskBot('${q}')" class="shrink-0 px-3 py-1 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[11px] font-medium text-[#007AFF]">${q}</button>
            `).join('')}
          </div>

          <form onsubmit="sendChatMessage(event)" class="pt-2 border-t border-black/[0.06] dark:border-white/[0.08] flex gap-2">
            <input id="chat-input" type="text" required placeholder="iMessage..." class="flex-1 px-4 py-2.5 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[14px] outline-none" />
            <button type="submit" class="w-10 h-10 rounded-full bg-[#007AFF] text-white flex items-center justify-center shrink-0">
              ${icon('send', 'w-4 h-4')}
            </button>
          </form>
        </div>
      `);
      scrollChatToBottom();
    }

    function renderChatMessages() {
      return state.supportChat.map(m => `
        <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
          <div class="max-w-[82%] px-3.5 py-2.5 rounded-[20px] text-[13px] leading-snug ${m.sender === 'user' ? 'bg-[#007AFF] text-white rounded-br-[6px]' : 'bg-[#E9E9EB] dark:bg-[#2C2C2E] rounded-bl-[6px]'}">
            ${escapeHTML(m.text)}
          </div>
        </div>
      `).join('');
    }

    function scrollChatToBottom() {
      const el = document.getElementById('chat-messages');
      if (el) el.scrollTop = el.scrollHeight;
    }

    function quickAskBot(text) {
      const inp = document.getElementById('chat-input');
      if (inp) {
        inp.value = text;
        sendChatMessage({ preventDefault: () => {} });
      }
    }

    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      state.supportChat.push({ sender: 'user', text, time: 'Сейчас' });
      input.value = '';
      document.getElementById('chat-messages').innerHTML = renderChatMessages();
      scrollChatToBottom();

      setTimeout(() => {
        const q = text.toLowerCase();
        let reply = 'Я могу подсказать про PDF-чеки, карты, переводы, кэшбэк или текущий курс доллара.';
        if (q.includes('чек') || q.includes('пдф') || q.includes('pdf')) reply = 'Нажмите на любую операцию на Главной или в Истории, затем выберите «PDF-чек». Его можно посмотреть внутри или скачать в формате .pdf с печатью и QR-кодом!';
        else if (q.includes('карт')) reply = 'Нажмите на любую карту в Кошельке, чтобы показать CVV, скопировать номер, изменить лимит или заморозить её.';
        else if (q.includes('перевод')) reply = 'Переводы по СБП проходят мгновенно и без комиссии. Тестовый SMS-код для подтверждения — 0000.';
        else if (q.includes('кэшбэк')) reply = 'Выберите до 3 категорий в разделе «Сервисы», затем оплатите любую услугу — кэшбэк начислится сразу.';
        else if (q.includes('курс') || q.includes('валют')) reply = `Текущий курс обмена: 1 USD = ${USD_RATE} ₽.`;

        state.supportChat.push({ sender: 'bot', text: reply, time: 'Сейчас' });
        saveState();
        const box = document.getElementById('chat-messages');
        if (box) {
          box.innerHTML = renderChatMessages();
          scrollChatToBottom();
        }
      }, 400);
    }

    applyTheme();
  </script>
</body>
</html>
